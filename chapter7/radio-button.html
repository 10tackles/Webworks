<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecting an option with a radio-button</title>
</head>
<body>
    <form action="http://www.example.com/profile.php">
        <p>
            Please select your favourite genre:
            <br />
            <input type="radio" name="genre" value="rock" checked="checked" /> Rock
            <input type="radio" name="genre" value="pop" checked="unchecked" /> Pop
            <input type="radio" name="genre" value="jazz" checked="unchecked" /> Jazz
        </p>
    </form>
</body>
</html>
